name: Publicar Socio Studio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Preparar Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Instalar dependencias
        run: npm ci

      - name: Generar archivos
        run: npm run build

      - name: Revisar configuracion
        run: npm run check:release

      - name: Comprobar funcionamiento
        run: npm test

      - name: Preparar sitio
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
